<html>
<head>
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .main_container
        {
            width: 226;
            margin: 50px auto;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px 10px 0px 10px;
        }
        .btn
        {
            width: 42px;
            height: 42px;
            margin: 5px 2.5px; 
        }
        textarea.form-control
        {
            height: 100px !important;
            min-height: 100px !important;
        }
    </style>
    </head>
<body>
    <div class="main_container">
        <div class="form-floating">
            <textarea class="form-control" placeholder="" id="display"></textarea>
        </div>
        <div class="btn-grp my-3">
            <button class="btn btn-warning" onclick="clearDisplay()">C</button>
            <button class="btn btn-warning" onclick="press('/')">/</button>
            <button class="btn btn-warning" onclick="press('*')">*</button>
            <button class="btn btn-warning" onclick="press('-')">-</button>
            <button class="btn btn-primary" onclick="press(7)">7</button>
            <button class="btn btn-primary" onclick="press(8)">8</button>
            <button class="btn btn-primary" onclick="press(9)">9</button>
            <button class="btn btn-warning" onclick="press('+')">+</button>
            <button class="btn btn-primary" onclick="press(4)">4</button>
            <button class="btn btn-primary" onclick="press(5)">5</button>
            <button class="btn btn-primary" onclick="press(6)">6</button>
            <button class="btn btn-warning" onclick="calculate()">=</button>
            <button class="btn btn-primary" onclick="press(1)">1</button>
            <button class="btn btn-primary" onclick="press(2)">2</button>
            <button class="btn btn-primary" onclick="press(3)">3</button>
            <button class="btn btn-primary" onclick="press(0)">0</button>
        </div>
        <!-- <div class="btn-grp my-3">
            <button type="button" class="btn btn-primary">+</button>
            <button type="button" class="btn btn-primary">-</button>
            <button type="button" class="btn btn-primary">*</button>
            <button type="button" class="btn btn-primary">/</button>
        </div> -->
    </div>

    <script>
        const display = document.getElementById("display");
        
        function press(value) {
            console.log("Button clicked:", value);
            display.value += value;
            console.log("Display:", display.value);
        }

        function calculate() {
            display.value = eval(display.value);
        }

        function clearDisplay() {
            display.value = "";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
